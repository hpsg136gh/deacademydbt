version: 2

models:
  - name: employee
    description: "Employee dbt model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1','2','3','4','5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check
  - name: customer
    description: "Customer dbt table"
  - name: customer_vw
    description: "DBT Model for the customer view"
  - name: sales
    description: "Sales dbt table" 
  - name: product
    description: "PRODUCT dbt table" 
  - name: purchase
    description: "Purchase dbt table" 

sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: employee_raw
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: customer_src
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: sales_src
  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: product_src
  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: purchase_src
