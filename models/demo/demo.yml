version: 2

models:
  - name: employee
    description: "Employee dbt model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1','2','3','4','5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check
  - name: customer
    description: "Customer dbt table"

sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: employee_raw
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: customer_src
