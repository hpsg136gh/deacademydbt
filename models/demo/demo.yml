version: 2

models:
  - name: employee
    description: "Employee dbt model"
    columns:
      - name: emp_id
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ['1','2','3','4','5']
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check
  - name: customer
    description: "Customer model dbt table"
  - name: customer_vw
    description: "DBT Model for the customer view"
  - name: sales
    description: "Sales model dbt table" 
  - name: product
    description: "PRODUCT modeldbt table" 
  - name: purchase
    description: "Purchase model dbt table" 
  - name: clean_orders
    description: "Orders ephemeral model dbt table"
  - name: final_orders
    description: "Final Orders model dbt table"
  - name: session
    description: "DBT Model for the session table"

sources:
  - name: employee
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: employee_raw
  - name: customer
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: customer_src
  - name: sales
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: sales_src
  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: product_src
  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: purchase_src
  - name: orders
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: base_orders
  - name: patient
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PATIENT_SRC
  - name: session
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: SESSION_SRC 
